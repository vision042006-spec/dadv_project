services:
  # Monolithic setup (Go API + Python Worker + Redis)
  - type: web
    name: dadv-monolith
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Set to your Netlify URL after deploy
      - key: API_PORT
        value: "10000"
